[package]
name = "i2c-proxmox-status"
version = "0.1.0"
edition = "2021"
description = "Proxmox stats on the UCTRONICS SKU_RM0004 rack-mount LCD (ST7735 over I2C)"
license = "GPL-3.0-only"

[dependencies]
embedded-graphics = "0.8"
libc = "0.2"
sysinfo = "0.36"

# Desktop-only preview (`cargo run --features simulator`); needs SDL2.
# Never enable on the Pi — the real display doesn't need it.
embedded-graphics-simulator = { version = "0.8", optional = true }
clap = { version = "4.6.5", features = ["derive"] }

[features]
simulator = ["dep:embedded-graphics-simulator"]
 